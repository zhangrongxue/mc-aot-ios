version: 2.1
jobs:
  horizon-ios-dev:
    macos:
      xcode: "27.2.0"
    resource_class: m4pro.medium
    environment:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - checkout
      - run:
          name: Install Rust with iOS target
          command: |
            set -euxo pipefail
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            . "$HOME/.cargo/env"
            rustup target add aarch64-apple-ios
            rustc -V
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
      - run:
          name: Prepare Horizon workspace
          command: |
            set -euxo pipefail
            git clone --depth 1 https://github.com/horizon-rust/horizon.git /tmp/horizon
            git -C /tmp/horizon fetch --depth 1 origin 69ab572dbd1bf2f2924a424f791014e09d9d0b50
            git -C /tmp/horizon checkout 69ab572dbd1bf2f2924a424f791014e09d9d0b50
            cp -R "$CIRCLE_WORKING_DIRECTORY/horizon-port/port/horizon-ios" /tmp/horizon/crates/horizon-ios
            python3 -c 'from pathlib import Path; p=Path("/tmp/horizon/Cargo.toml"); s=p.read_text(); s=s.replace("members = [", "members = [\n    \"crates/horizon-ios\",", 1); p.write_text(s)'
            grep -n 'horizon-ios' /tmp/horizon/Cargo.toml
            cd /tmp/horizon
            git rev-parse HEAD
      - run:
          name: Apply iOS port patch
          command: |
            set -euxo pipefail
            cd /tmp/horizon
            git apply --verbose "$CIRCLE_WORKING_DIRECTORY/horizon-port/patches/ios-deps.patch"
            git --no-pager diff --stat
      - run:
          name: Diagnose horizon-client-lib for iOS
          no_output_timeout: 30m
          command: |
            set +e
            . "$HOME/.cargo/env"
            cd /tmp/horizon
            cargo check -p horizon-client-lib --target aarch64-apple-ios --no-default-features 2>&1 | tee /tmp/clientlib-check.log
            echo "clientlib check exit: ${PIPESTATUS[0]}"
      - run:
          name: Build iOS static library
          no_output_timeout: 30m
          command: |
            set -o pipefail
            . "$HOME/.cargo/env"
            cd /tmp/horizon
            cargo build -p horizon-ios --target aarch64-apple-ios --release 2>&1 | tee /tmp/staticlib.log
      - run:
          name: Package unsigned IPA
          command: |
            set -euxo pipefail
            cd "$CIRCLE_WORKING_DIRECTORY"
            HORIZON_DIR=/tmp/horizon bash horizon-port/ios/build.sh
      - store_artifacts:
          path: horizon-port/dist
      - store_artifacts:
          path: /tmp/staticlib.log
      - store_artifacts:
          path: /tmp/clientlib-check.log
workflows:
  horizon-ios-dev:
    jobs:
      - horizon-ios-dev