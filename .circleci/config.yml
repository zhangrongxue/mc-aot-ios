version: 2.1

# B1: native-image smoke on the *client* class graph.
# The graph was captured locally (CI has no OpenGL) and lives as a private release asset.

jobs:
  b1-client-image:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    environment:
      GRAPH_TAG: b1-client-graph
      GRAPH_REPO: zhangrongxue/mc-aot-sign
    steps:
      - checkout
      - run:
          name: Java 21 + GraalVM 21
          command: |
            set -euo pipefail
            cd "$HOME"
            curl -fsSL -o jdk21.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
            mkdir -p jdk21 && tar xzf jdk21.tar.gz -C jdk21 --strip-components=1
            if [ -x "$HOME/jdk21/Contents/Home/bin/java" ]; then ln -sfn "$HOME/jdk21/Contents/Home" "$HOME/jdk21-home"; else ln -sfn "$HOME/jdk21" "$HOME/jdk21-home"; fi
            curl -fsSL -o graalvm.tar.gz "https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-21.0.2/graalvm-community-jdk-21.0.2_macos-aarch64_bin.tar.gz"
            mkdir -p graalvm && tar xzf graalvm.tar.gz -C graalvm --strip-components=1
            GRAAL_HOME="$HOME/graalvm/Contents/Home"
            [ -x "$GRAAL_HOME/bin/native-image" ] || GRAAL_HOME="$HOME/graalvm"
            echo "export GRAAL_HOME=$GRAAL_HOME" >> "$BASH_ENV"
            echo 'export JAVA_HOME="$HOME/jdk21-home"' >> "$BASH_ENV"
            echo 'export PATH="$GRAAL_HOME/bin:$HOME/jdk21-home/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Fetch the private client graph
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            if [ -z "${GH_TOKEN:-}" ]; then echo "GH_TOKEN missing"; exit 1; fi
            mkdir -p ~/b1 && cd ~/b1
            META=$(curl -sSL -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GRAPH_REPO/releases/tags/$GRAPH_TAG")
            URL=$(printf '%s' "$META" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["assets"][0]["url"])')
            echo "asset: $URL"
            curl -sSL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" "$URL" -o graph.zip
            ls -lh graph.zip
            python3 "$CIRCLE_WORKING_DIRECTORY/b1/n1/unzip_norm.py" graph.zip graph
            echo "classes: $(find graph -name '*.class' | wc -l | tr -d ' ')"
            echo "client classes: $(find graph -path '*net/minecraft/client/*' -name '*.class' | wc -l | tr -d ' ')"
            # native-image opens classpath entries as file systems; a jar avoids the directory path
            jar cf graph.jar -C graph .
            ls -lh graph.jar
      - run:
          name: Build the client smoke image
          when: always
          no_output_timeout: 60m
          command: |
            set -uo pipefail
            source "$BASH_ENV"
            cd ~/b1
            cp "$CIRCLE_WORKING_DIRECTORY/b1/n05/ClientSmoke.java" .
            javac -cp graph.jar -d . ClientSmoke.java || echo "javac failed"
            ( native-image -cp "graph.jar:." -H:+ReportExceptionStackTraces -J-Xmx6g \
                --no-fallback -o b1client ClientSmoke > native-image.log 2>&1 ) &
            NI_PID=$!
            i=0
            while [ "$i" -lt 300 ]; do
              i=$((i + 1))
              if ! kill -0 "$NI_PID" 2>/dev/null; then break; fi
              sleep 10
            done
            if kill -0 "$NI_PID" 2>/dev/null; then echo "native-image still running after 50 min, killing"; kill "$NI_PID" 2>/dev/null; fi
            wait "$NI_PID" 2>/dev/null
            echo "---- last 60 lines ----"
            tail -60 native-image.log || true
            echo "---- errors ----"
            grep -E '^Error|Caused by|UnsupportedFeature|not reachable|NoClassDefFound' native-image.log | head -40 || true
            if [ -x b1client ]; then echo "IMAGE BUILT: $(ls -lh b1client | awk '{print $5}')"; ./b1client || true; else echo "IMAGE NOT BUILT"; fi
      - store_artifacts:
          path: ~/b1/native-image.log
          destination: b1-client-native-image.log

workflows:
  b1image:
    jobs:
      - b1-client-image
