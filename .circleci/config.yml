version: 2.1

# B1 line - client-side graph
#   Installs the NeoForge *client* and runs it briefly on the macOS runner with the dump agent
#   (forced-load delay shortened to 12 s so it fires before the game finishes booting).
#   Goal: capture net/minecraft/client/** classes, which the server install never has.

jobs:
  b1-client:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    environment:
      NEOFORGE_VERSION: "21.1.250"
    steps:
      - checkout
      - run:
          name: Java 21 (Temurin)
          command: |
            set -euo pipefail
            cd "$HOME"
            curl -fsSL -o jdk21.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
            mkdir -p jdk21 && tar xzf jdk21.tar.gz -C jdk21 --strip-components=1
            if [ -x "$HOME/jdk21/Contents/Home/bin/java" ]; then ln -sfn "$HOME/jdk21/Contents/Home" "$HOME/jdk21-home"; else ln -sfn "$HOME/jdk21" "$HOME/jdk21-home"; fi
            echo 'export JAVA_HOME="$HOME/jdk21-home"' >> "$BASH_ENV"
            echo 'export PATH="$HOME/jdk21-home/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install the NeoForge client
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            which java; java -version
            mkdir -p ~/b1/client ~/b1/agent ~/b1/dump && cd ~/b1/client
            echo '{"profiles":{}}' > launcher_profiles.json
            curl -fsSL -o neoforge-installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE_VERSION}/neoforge-${NEOFORGE_VERSION}-installer.jar"
            java -jar neoforge-installer.jar --installClient .
            ls -la
      - run:
          name: Build the dump agent
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            cd ~/b1/agent
            cp "$CIRCLE_WORKING_DIRECTORY/b1/n0/DumpAgent.java" .
            javac -encoding UTF-8 -d . DumpAgent.java
            printf 'Premain-Class: DumpAgent\n' > manifest.txt
            jar cfm dumpagent.jar manifest.txt ./*.class
            ls -l
      - run:
          name: Run the client briefly and dump
          no_output_timeout: 20m
          command: |
            set -uo pipefail
            source "$BASH_ENV"
            cd ~/b1/client
            find libraries -name '*.jar' > ~/b1/jars.txt
            echo "library jars: $(wc -l < ~/b1/jars.txt | tr -d ' ')"
            export JAVA_TOOL_OPTIONS="-javaagent:$HOME/b1/agent/dumpagent.jar=$HOME/b1/dump|$HOME/b1/jars.txt|120000"
            echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"
            python3 "$CIRCLE_WORKING_DIRECTORY/b1/b1/launch_client.py" --root "$HOME/b1/client" > ~/b1/run.log 2>&1 &
            CLIENT_PID=$!
            i=0
            while [ "$i" -lt 36 ]; do
              i=$((i + 1))
              if grep -q 'forced ok=' ~/b1/run.log 2>/dev/null; then echo "forced loader done at $((i*5))s"; break; fi
              if ! kill -0 "$CLIENT_PID" 2>/dev/null; then echo "client exited at $((i*5))s"; break; fi
              sleep 5
            done
            sleep 5
            kill "$CLIENT_PID" 2>/dev/null || true
            wait "$CLIENT_PID" 2>/dev/null || true
            grep 'forced ok=' ~/b1/run.log || echo "forced-loader line not found"
            echo "classes dumped: $(find ~/b1/dump -name '*.class' | wc -l | tr -d ' ')"
            echo "client classes: $(find ~/b1/dump -path '*net/minecraft/client/*' -name '*.class' | wc -l | tr -d ' ')"
            tail -20 ~/b1/run.log || true
      - run:
          name: A. plain-JVM load smoke for client classes
          when: always
          command: |
            set -u
            source "$BASH_ENV"
            cd ~/b1
            cp "$CIRCLE_WORKING_DIRECTORY/b1/b1/ClientLoad.java" .
            javac -d . ClientLoad.java || echo "javac failed"
            java -cp "dump:." ClientLoad > client-load.txt 2>&1
            echo "exit: $?"
            cat client-load.txt
            exit 0
      - store_artifacts:
          path: ~/b1/run.log
          destination: b1-client-run.log
      - store_artifacts:
          path: ~/b1/client-load.txt
          destination: b1-client-load.txt

workflows:
  b1client:
    jobs:
      - b1-client
