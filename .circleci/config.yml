version: 2.1

# B1 线 · N0.5（第二轮）：
#   A. 图谱补全：N0 的 dump 只有"运行期真正加载过"的类，缺被引用但没加载的类。
#      把服务端 classpath 上的所有 jar 解开与 dump 合并，再做纯 JVM 加载冒烟。
#   B. 对补全后的图谱做 GraalVM native-image 冒烟。

jobs:
  neoforge-n05:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    environment:
      NEOFORGE_VERSION: "21.1.250"
    steps:
      - checkout
      - run:
          name: Java 21 (Temurin)
          command: |
            set -euo pipefail
            cd "$HOME"
            curl -fsSL -o jdk21.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
            mkdir -p jdk21 && tar xzf jdk21.tar.gz -C jdk21 --strip-components=1
            if [ -x "$HOME/jdk21/Contents/Home/bin/java" ]; then ln -sfn "$HOME/jdk21/Contents/Home" "$HOME/jdk21-home"; else ln -sfn "$HOME/jdk21" "$HOME/jdk21-home"; fi
            echo 'export JAVA_HOME="$HOME/jdk21-home"' >> "$BASH_ENV"
            echo 'export PATH="$HOME/jdk21-home/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: NeoForge server + class dump
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            which java; java -version
            mkdir -p ~/n0/server ~/n0/agent ~/n0/dump && cd ~/n0/server
            echo "eula=true" > eula.txt
            curl -fsSL -o neoforge-installer.jar "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE_VERSION}/neoforge-${NEOFORGE_VERSION}-installer.jar"
            java -jar neoforge-installer.jar --installServer .
            cd ~/n0/agent
            cp "$CIRCLE_WORKING_DIRECTORY/b1/n0/DumpAgent.java" .
            javac -d . DumpAgent.java
            printf 'Premain-Class: DumpAgent\n' > manifest.txt
            jar cfm dumpagent.jar manifest.txt ./*.class
            cd ~/n0/server
            export JAVA_TOOL_OPTIONS="-javaagent:$HOME/n0/agent/dumpagent.jar=$HOME/n0/dump"
            sh ./run.sh nogui > ~/n0/run.log 2>&1 &
            SERVER_PID=$!
            i=0
            while [ "$i" -lt 60 ]; do
              i=$((i + 1))
              if grep -q 'Done (' ~/n0/run.log 2>/dev/null; then echo "server Done at $((i*5))s"; break; fi
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then echo "server exited early"; break; fi
              sleep 5
            done
            sleep 10
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            echo "classes dumped: $(find ~/n0/dump -name '*.class' | wc -l | tr -d ' ')"
      - run:
          name: A. complete the graph and load it without ModLauncher
          command: |
            set -u
            source "$BASH_ENV"
            cd ~/n0
            ARGS_FILE=$(find server/libraries -name unix_args.txt | head -1)
            echo "classpath file: $ARGS_FILE"
            echo "---- head of args ----"
            head -c 400 "$ARGS_FILE" || true
            echo
            grep -oE '(/|[A-Za-z0-9_.-])[^:[:space:]]*\.jar' "$ARGS_FILE" | sort -u > jars.txt || true
            echo "jars listed: $(wc -l < jars.txt | tr -d ' ')"
            mkdir -p graph
            while IFS= read -r jar; do
              case "$jar" in
                /*) full="$jar" ;;
                *) full="server/libraries/$jar" ;;
              esac
              if [ -f "$full" ]; then
                unzip -oq "$full" '*.class' -d graph 2>/dev/null || true
              else
                echo "missing jar: $full"
              fi
            done < jars.txt
            echo "library classes: $(find graph -name '*.class' | wc -l | tr -d ' ')"
            cp -R dump/. graph/ 2>/dev/null || true
            echo "graph total: $(find graph -name '*.class' | wc -l | tr -d ' ')"
            cp "$CIRCLE_WORKING_DIRECTORY/b1/n05/N0Load.java" .
            javac -cp graph -d . N0Load.java || echo "javac failed"
            java -cp graph:. N0Load > load-smoke.txt 2>&1
            echo "load smoke exit: $?"
            tail -20 load-smoke.txt || true
      - run:
          name: B. GraalVM native-image smoke
          no_output_timeout: 45m
          command: |
            set -uo pipefail
            source "$BASH_ENV"
            cd "$HOME"
            curl -fsSL -o graalvm.tar.gz "https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-21.0.2/graalvm-community-jdk-21.0.2_macos-aarch64_bin.tar.gz"
            mkdir -p graalvm && tar xzf graalvm.tar.gz -C graalvm --strip-components=1
            GRAAL_HOME="$HOME/graalvm/Contents/Home"
            [ -x "$GRAAL_HOME/bin/native-image" ] || GRAAL_HOME="$HOME/graalvm"
            echo "graal home: $GRAAL_HOME"
            "$GRAAL_HOME/bin/native-image" --version || true
            cd ~/n0
            cp "$CIRCLE_WORKING_DIRECTORY/b1/n05/N0Smoke.java" .
            "$GRAAL_HOME/bin/javac" -cp graph -d . N0Smoke.java || echo "javac failed"
            ( "$GRAAL_HOME/bin/native-image" -cp "graph:." -H:+ReportExceptionStackTraces \
                -J-Xmx6g --no-fallback -o n0smoke N0Smoke > native-image.log 2>&1 ) &
            NI_PID=$!
            i=0
            while [ "$i" -lt 180 ]; do
              i=$((i + 1))
              if ! kill -0 "$NI_PID" 2>/dev/null; then break; fi
              sleep 10
            done
            if kill -0 "$NI_PID" 2>/dev/null; then echo "native-image still running after 30 min, killing"; kill "$NI_PID" 2>/dev/null; fi
            wait "$NI_PID" 2>/dev/null
            echo "---- last 50 lines ----"
            tail -50 native-image.log || true
            echo "---- error summary ----"
            grep -E '^Error|Caused by|UnsupportedFeature|not reachable|NoClassDefFound' native-image.log | head -40 || true
            if [ -x n0smoke ]; then echo "IMAGE BUILT: $(ls -lh n0smoke | awk '{print $5}')"; ./n0smoke || true; else echo "IMAGE NOT BUILT"; fi
      - run:
          name: Package the smoke evidence
          when: always
          command: |
            cd ~/n0
            tar czf n05-smoke.tgz load-smoke.txt native-image.log 2>/dev/null || true
            ls -lh n05-smoke.tgz || true
      - store_artifacts:
          path: ~/n0/n05-smoke.tgz
          destination: n05-smoke.tgz
      - store_artifacts:
          path: ~/n0/load-smoke.txt
          destination: load-smoke.txt
      - store_artifacts:
          path: ~/n0/native-image.log
          destination: native-image.log

workflows:
  n05:
    jobs:
      - neoforge-n05
