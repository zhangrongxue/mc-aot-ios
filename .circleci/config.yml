version: 2.1

# B1: does a newer LWJGL initialise its MemoryUtil inside a native image?
# 3.3.3 (what the pack ships) fails with "Failed to find field offset in class" because it reads
# java.nio.Buffer offsets through sun.misc.Unsafe. This job tries the candidate versions with a
# minimal image, which is far cheaper than rebuilding the 358 MB client image.

jobs:
  lwjgl-probe:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    steps:
      - checkout
      - run:
          name: Java 21 + GraalVM 21
          command: |
            set -euo pipefail
            cd "$HOME"
            curl -fsSL -o jdk21.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
            mkdir -p jdk21 && tar xzf jdk21.tar.gz -C jdk21 --strip-components=1
            if [ -x "$HOME/jdk21/Contents/Home/bin/java" ]; then ln -sfn "$HOME/jdk21/Contents/Home" "$HOME/jdk21-home"; else ln -sfn "$HOME/jdk21" "$HOME/jdk21-home"; fi
            curl -fsSL -o graalvm.tar.gz "https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-21.0.2/graalvm-community-jdk-21.0.2_macos-aarch64_bin.tar.gz"
            mkdir -p graalvm && tar xzf graalvm.tar.gz -C graalvm --strip-components=1
            GRAAL_HOME="$HOME/graalvm/Contents/Home"
            [ -x "$GRAAL_HOME/bin/native-image" ] || GRAAL_HOME="$HOME/graalvm"
            # Xcode 27 .tbd stubs need a current lld
            LLD="$GRAAL_HOME/lib/svm/bin/ld64.lld"
            if [ -f "$LLD" ]; then
              mv "$LLD" "$LLD.bundled"
              brew list lld >/dev/null 2>&1 || brew install lld
              printf '#!/bin/sh\nexec "%s/bin/ld64.lld" "$@"\n' "$(brew --prefix lld)" > "$LLD"
              chmod +x "$LLD"
            fi
            echo "export GRAAL_HOME=$GRAAL_HOME" >> "$BASH_ENV"
            echo 'export JAVA_HOME="$HOME/jdk21-home"' >> "$BASH_ENV"
            echo 'export PATH="$GRAAL_HOME/bin:$HOME/jdk21-home/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Probe each LWJGL version
          when: always
          no_output_timeout: 40m
          command: |
            set -uo pipefail
            source "$BASH_ENV"
            mkdir -p ~/probe && cd ~/probe
            cp "$CIRCLE_WORKING_DIRECTORY/b1/n06/LwjglProbe.java" .
            for V in 3.3.3 3.3.6 3.4.3; do
              echo "===================== lwjgl $V"
              mkdir -p "lib-$V" && cd "lib-$V"
              cp "../LwjglProbe.java" .
              CP=""
              for m in lwjgl lwjgl-glfw lwjgl-opengl lwjgl-stb lwjgl-tinyfd lwjgl-openal lwjgl-jemalloc lwjgl-freetype; do
                curl -fsSL -o "$m.jar" "https://repo1.maven.org/maven2/org/lwjgl/$m/$V/$m-$V.jar" || true
                curl -fsSL -o "$m-natives.jar" "https://repo1.maven.org/maven2/org/lwjgl/$m/$V/$m-$V-natives-macos-arm64.jar" || true
                unzip -oq "$m-natives.jar" -d natives 2>/dev/null || true
                CP="$CP:$m.jar"
              done
              CP="${CP#:}"
              javac -proc:none -cp "$CP" -d . LwjglProbe.java || echo "javac failed for $V"
              ( native-image -cp "$CP:." -J-Xmx6g --no-fallback -o "probe-$V" LwjglProbe > "build-$V.log" 2>&1 ) || true
              if [ -x "probe-$V" ]; then
                echo "image built for $V: $(ls -lh probe-$V | awk '{print $5}')"
                B1_NATIVES="$PWD/natives" ./"probe-$V" || echo "run exit: $?"
              else
                echo "image NOT built for $V"
                grep -E 'Fatal|error|Error' "build-$V.log" | head -8 || true
              fi
              cd ..
            done
      - store_artifacts:
          path: ~/probe
          destination: lwjgl-probe

workflows:
  lwjglprobe:
    jobs:
      - lwjgl-probe
