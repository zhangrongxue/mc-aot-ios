version: 2.1

# B1: is the LWJGL failure caused by the graph's copies of the LWJGL classes?
# The standalone probe (LWJGL jars from Maven) initialises MemoryUtil fine, the client image
# (LWJGL classes taken from the dump) does not. This job builds the same probe against the graph.

jobs:
  lwjgl-graph-probe:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    environment:
      GRAPH_TAG: b1-client-graph3
      GRAPH_REPO: zhangrongxue/mc-aot-sign
      OVERRIDES_TAG: b1-overrides
    steps:
      - checkout
      - run:
          name: Java 21 + GraalVM 21
          command: |
            set -euo pipefail
            cd "$HOME"
            curl -fsSL -o jdk21.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
            mkdir -p jdk21 && tar xzf jdk21.tar.gz -C jdk21 --strip-components=1
            if [ -x "$HOME/jdk21/Contents/Home/bin/java" ]; then ln -sfn "$HOME/jdk21/Contents/Home" "$HOME/jdk21-home"; else ln -sfn "$HOME/jdk21" "$HOME/jdk21-home"; fi
            curl -fsSL -o graalvm.tar.gz "https://github.com/graalvm/graalvm-ce-builds/releases/download/jdk-21.0.2/graalvm-community-jdk-21.0.2_macos-aarch64_bin.tar.gz"
            mkdir -p graalvm && tar xzf graalvm.tar.gz -C graalvm --strip-components=1
            GRAAL_HOME="$HOME/graalvm/Contents/Home"
            [ -x "$GRAAL_HOME/bin/native-image" ] || GRAAL_HOME="$HOME/graalvm"
            LLD="$GRAAL_HOME/lib/svm/bin/ld64.lld"
            if [ -f "$LLD" ]; then
              mv "$LLD" "$LLD.bundled"
              brew list lld >/dev/null 2>&1 || brew install lld
              printf '#!/bin/sh\nexec "%s/bin/ld64.lld" "$@"\n' "$(brew --prefix lld)" > "$LLD"
              chmod +x "$LLD"
            fi
            echo "export GRAAL_HOME=$GRAAL_HOME" >> "$BASH_ENV"
            echo 'export JAVA_HOME="$HOME/jdk21-home"' >> "$BASH_ENV"
            echo 'export PATH="$GRAAL_HOME/bin:$HOME/jdk21-home/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Build and run the probe against the graph
          when: always
          no_output_timeout: 40m
          command: |
            set -uo pipefail
            source "$BASH_ENV"
            gh_api() { curl -sSL -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
            mkdir -p ~/b1 && cd ~/b1
            META=$(gh_api "https://api.github.com/repos/$GRAPH_REPO/releases/tags/$GRAPH_TAG")
            URL=$(printf '%s' "$META" | python3 -c 'import json,sys; print(json.load(sys.stdin)["assets"][0]["url"])')
            curl -sSL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" "$URL" -o graph.tgz
            mkdir -p graph && tar -xzf graph.tgz -C graph
            OVER=$(gh_api "https://api.github.com/repos/$GRAPH_REPO/releases/tags/$OVERRIDES_TAG")
            OV_URL=$(printf '%s' "$OVER" | python3 -c 'import json,sys; a=json.load(sys.stdin).get("assets",[]); print(a[0]["url"] if a else "")')
            if [ -n "$OV_URL" ]; then
              curl -sSL -H "Authorization: token $GH_TOKEN" -H "Accept: application/octet-stream" "$OV_URL" -o overrides.tgz
              tar -xzf overrides.tgz -C graph
            fi
            rm -rf graph/java graph/jdk graph/sun graph/com/sun 2>/dev/null || true
            jar cf graph.jar -C graph .
            cp "$CIRCLE_WORKING_DIRECTORY/b1/n06/LwjglProbe.java" .
            mkdir -p natives
            for m in lwjgl lwjgl-glfw lwjgl-opengl lwjgl-stb lwjgl-tinyfd lwjgl-openal lwjgl-jemalloc lwjgl-freetype; do
              curl -fsSL -o "/tmp/$m.jar" "https://repo1.maven.org/maven2/org/lwjgl/$m/3.3.3/$m-3.3.3-natives-macos-arm64.jar" && unzip -oq "/tmp/$m.jar" -d natives || true
            done
            javac -proc:none -cp graph.jar -d . LwjglProbe.java || echo "javac failed"
            CONF=""
            for cfg in graph/b1-reflect-config.json graph/b1-reflect-equals.json graph/b1-reflect-plugins.json graph/b1-reflect-services.json; do
              if [ -f "$cfg" ]; then CONF="${CONF:+$CONF,}$cfg"; fi
            done
            REFLECT=""
            if [ -n "$CONF" ]; then REFLECT="-H:ReflectionConfigurationFiles=$CONF"; fi
            echo "---- probe WITHOUT reflect configs ----"
            ( native-image -cp "graph.jar:." -J-Xmx6g --no-fallback -o probe-plain LwjglProbe > plain.log 2>&1 ) || true
            if [ -x probe-plain ]; then B1_NATIVES="$PWD/natives" ./probe-plain || echo "run exit: $?"; else tail -20 plain.log; fi
            echo "---- probe WITH reflect configs ----"
            ( native-image -cp "graph.jar:." -J-Xmx6g $REFLECT --no-fallback -o probe-reflect LwjglProbe > reflect.log 2>&1 ) || true
            if [ -x probe-reflect ]; then B1_NATIVES="$PWD/natives" ./probe-reflect || echo "run exit: $?"; else tail -20 reflect.log; fi
      - store_artifacts:
          path: ~/b1/plain.log
          destination: probe-plain.log
      - store_artifacts:
          path: ~/b1/reflect.log
          destination: probe-reflect.log

workflows:
  lwjglgraphprobe:
    jobs:
      - lwjgl-graph-probe
