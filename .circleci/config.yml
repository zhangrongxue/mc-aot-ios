version: 2.1

jobs:
  build-aot:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    environment:
      HOMEBREW_NO_AUTO_UPDATE: 1
      PYTHONDONTWRITEBYTECODE: "1"
      UPSTREAM: https://github.com/AOTFASTLNX/MCFAO
      SOURCE_REF: fix/gl41-pacing
      MCFAO_OPT_LEVEL: -O3
      RELEASE_REPO: zhangrongxue/mc-aot-sign
    steps:
      - run:
          name: Host facts
          command: |
            uname -m; sysctl -n hw.memsize | awk '{printf "memory: %.1f GiB\n", $1/1073741824}'
            xcodebuild -version | head -2
      - run:
          name: Build the game IPA
          no_output_timeout: 60m
          command: |
            set -euo pipefail
            mkdir -p ~/build && cd ~/build
            curl -fsSL -o build_mac.sh https://raw.githubusercontent.com/AOTFASTLNX/MCFAO/acb3a909a2af3c18bb8eb93d504dc96249df14e4/ci/build_mac.sh
            MCFAO_TOKEN="$MCFAO_TOKEN" FAOT_RENDERER=gl41 FAOT_BUILD_LOADER=vanilla HEAP_GIB=9 JOBS=6 AOT_PAR=4 SLIM_ASSETS=0 \
              UPSTREAM="$UPSTREAM" SOURCE_REF="$SOURCE_REF" SOURCE_SHA=acb3a909a2af3c18bb8eb93d504dc96249df14e4 bash build_mac.sh
      - store_artifacts:
          path: ~/mcfao-build/FabricAOT-game.ipa
          destination: FabricAOT-game.ipa
      - store_artifacts:
          path: ~/mcfao-build/build.log
          destination: build.log
      - run:
          name: Publish the IPA to the private release
          when: always
          no_output_timeout: 30m
          command: |
            set -euo pipefail
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "GH_TOKEN is not set; skipping the mirror upload"
              exit 0
            fi
            IPA="$HOME/mcfao-build/FabricAOT-game.ipa"
            [ -f "$IPA" ] || { echo "no IPA to publish"; exit 0; }
            SHA=$(shasum -a 256 "$IPA" | awk '{print $1}')
            TAG="ipa-$(date -u +%Y%m%d-%H%M)-$(echo "$SHA" | cut -c1-8)"
            BODY="source ${SOURCE_SHA:-unknown}; sha256 $SHA; built $(date -u +%FT%TZ)"
            echo "creating release $TAG in $RELEASE_REPO"
            CREATE=$(printf '{"tag_name":"%s","name":"%s","body":"%s","target_commitish":"main"}' "$TAG" "$TAG" "$BODY" \
              | curl -sS -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                  -H "Content-Type: application/json" --data-binary @- \
                  "https://api.github.com/repos/$RELEASE_REPO/releases")
            UPLOAD=$(echo "$CREATE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"].split("{")[0])')
            echo "uploading to $UPLOAD"
            curl -sS --fail -X POST -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$IPA" \
              "$UPLOAD?name=FabricAOT-game-$TAG.ipa" | head -c 400
            echo
            echo "published: https://github.com/$RELEASE_REPO/releases/tag/$TAG"
      - run:
          name: Tail on failure
          when: on_fail
          command: tail -60 ~/mcfao-build/build.log || true

workflows:
  build:
    jobs:
      - build-aot
