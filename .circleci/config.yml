version: 2.1

# B1 线 · N0 实验：证明 NeoForge 的引导链能否走"构建期静态化"路线。
# 在 macOS + Java 21 上真实启动 NeoForge 21.1.250 服务端（headless），
# 用 javaagent 把每个被加载（含 Mixin/AT 转换后）的类字节落盘。
# 产出：dump/（全部类字节）、mixin 导出、run.log。

jobs:
  neoforge-n0:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium
    environment:
      NEOFORGE_VERSION: "21.1.250"
      MC_VERSION: "1.21.1"
    steps:
      - checkout
      - run:
          name: Java 21 (Temurin)
          command: |
            set -euo pipefail
            cd "$HOME"
            curl -fsSL -o jdk21.tar.gz "https://api.adoptium.net/v3/binary/latest/21/ga/mac/aarch64/jdk/hotspot/normal/eclipse"
            mkdir -p jdk21 && tar xzf jdk21.tar.gz -C jdk21 --strip-components=1
            # macOS tarballs nest the JDK under Contents/Home
            if [ -x "$HOME/jdk21/Contents/Home/bin/java" ]; then
              ln -sfn "$HOME/jdk21/Contents/Home" "$HOME/jdk21-home"
            else
              ln -sfn "$HOME/jdk21" "$HOME/jdk21-home"
            fi
            echo 'export JAVA_HOME="$HOME/jdk21-home"' >> "$BASH_ENV"
            echo 'export PATH="$HOME/jdk21-home/bin:$PATH"' >> "$BASH_ENV"
            echo "java home: $HOME/jdk21-home"
      - run:
          name: Install the NeoForge server
          no_output_timeout: 20m
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            which java; java -version; echo "JAVA_HOME=$JAVA_HOME"
            mkdir -p ~/n0/server && cd ~/n0/server
            echo "eula=true" > eula.txt
            INSTALLER="neoforge-${NEOFORGE_VERSION}-installer.jar"
            curl -fsSL -o "$INSTALLER" "https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE_VERSION}/${INSTALLER}"
            shasum -a 256 "$INSTALLER" | tee installer.sha256
            java -jar "$INSTALLER" --installServer .
            ls -la
      - run:
          name: Build the class dump agent
          command: |
            set -euo pipefail
            source "$BASH_ENV"
            mkdir -p ~/n0/agent && cd ~/n0/agent
            cp "$CIRCLE_WORKING_DIRECTORY/b1/n0/DumpAgent.java" .
            printf 'Premain-Class: DumpAgent\nCan-Retransform-Classes: false\n' > manifest.txt
            javac -d . DumpAgent.java
            jar cfm dumpagent.jar manifest.txt ./*.class
            unzip -l dumpagent.jar
      - run:
          name: Run the server and dump every loaded class
          no_output_timeout: 20m
          command: |
            set -uo pipefail
            source "$BASH_ENV"
            cd ~/n0/server
            mkdir -p ~/n0/dump
            # JAVA_TOOL_OPTIONS is honoured by every JVM start, including the one run.sh spawns.
            export JAVA_TOOL_OPTIONS="-javaagent:$HOME/n0/agent/dumpagent.jar=$HOME/n0/dump -Dmixin.debug.export=true"
            echo "JAVA_TOOL_OPTIONS=$JAVA_TOOL_OPTIONS"
            echo "-Dmixin.debug.export=true" >> user_jvm_args.txt
            cat user_jvm_args.txt
            sh ./run.sh nogui > ~/n0/run.log 2>&1 &
            SERVER_PID=$!
            i=0
            while [ "$i" -lt 60 ]; do
              i=$((i + 1))
              if grep -q 'Done (' ~/n0/run.log 2>/dev/null; then echo "server reached Done at $((i*5))s"; break; fi
              if ! kill -0 "$SERVER_PID" 2>/dev/null; then echo "server exited early"; break; fi
              sleep 5
            done
            sleep 10
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            echo "dumped so far: $(find ~/n0/dump -name '*.class' | wc -l | tr -d ' ')"
            echo "---- log tail ----"
            tail -30 ~/n0/run.log || true
            grep -m3 -i 'javaagent\|dumpagent\|Picked up JAVA_TOOL_OPTIONS' ~/n0/run.log || true
      - run:
          name: Summarise the dump
          command: |
            set -euo pipefail
            cd ~/n0
            COUNT=$(find dump -name '*.class' | wc -l | tr -d ' ')
            echo "classes dumped: $COUNT"
            echo "top packages:"
            find dump -name '*.class' | sed 's#^dump/##; s#/[^/]*$##' | cut -d/ -f1-3 | sort | uniq -c | sort -rn | head -20
            echo "client classes: $(find dump -path '*net/minecraft/client/*' -name '*.class' | wc -l | tr -d ' ')"
            echo "mixin exports: $(find server -path '*mixin.out*' -name '*.class' 2>/dev/null | wc -l | tr -d ' ')"
            find dump -name '*.class' | sort > dump-index.txt
            tar czf n0-dump.tgz dump
            if [ -d server/.mixin.out ]; then tar czf n0-mixin.tgz -C server .mixin.out; fi
            ls -lh n0-dump.tgz n0-mixin.tgz 2>/dev/null || ls -lh n0-dump.tgz
            if [ "$COUNT" -lt 1000 ]; then echo "FAIL: the dump is empty or truncated ($COUNT classes)"; exit 1; fi
      - store_artifacts:
          path: ~/n0/n0-dump.tgz
          destination: n0-dump.tgz
      - store_artifacts:
          path: ~/n0/n0-mixin.tgz
          destination: n0-mixin.tgz
      - store_artifacts:
          path: ~/n0/run.log
          destination: n0-run.log
      - store_artifacts:
          path: ~/n0/dump-index.txt
          destination: n0-dump-index.txt

workflows:
  n0:
    jobs:
      - neoforge-n0
