[package]
name = "horizon-ios"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "iOS static-library entry point for the Horizon Rust client"

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
horizon-core = { path = "../horizon-core" }
horizon-client = { path = "../horizon-client", default-features = false }
horizon-client-lib = { path = "../horizon-client-lib", default-features = false }
horizon-mod-package = { path = "../horizon-mod-package", default-features = false }
